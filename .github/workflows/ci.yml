name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - name: Verify manuscript snapshot
        run: sha256sum --check paper/SHA256SUMS
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      - name: Check proof dependencies
        run: lake env lean -DwarningAsError=true scripts/check-axioms.lean
      - name: Check manuscript statements
        run: lake env lean -DwarningAsError=true scripts/check-paper-statements.lean
